<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eventos DOM</title>

    <style>
      div#area {
        font:
          normal 20pt Arial,
          sans-serif;
        color: #333;
        background-color: rgb(43, 188, 17);
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="area">Interaja aqui</div>

    <script>
      var a = document.getElementById('area');

      a.addEventListener('click', clicar);
      a.addEventListener('mouseenter', entrar);
      a.addEventListener('mouseout', sair);

      function clicar() {
        a.innerText = 'Clicou!';
        a.style.background = 'rgb(255, 0, 0)';
      }

      function entrar() {
        a.innerText = 'Entrou!';
      }

      function sair() {
        a.innerText = 'Saiu!';
        a.style.background = 'rgb(43, 188, 17)';
      }
    </script>
  </body>
</html>
