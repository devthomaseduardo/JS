<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gerador de Tabuada</title>

  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <header>
    <h1>Gerador de Tabuada</h1>
  </header>

  <main>

    <section>

      <label for="numero">
        Digite um número
      </label>

      <input
        type="number"
        id="numero"
        placeholder="Ex: 5"
      >

      <button onclick="gerarTabuada()">
        Gerar
      </button>

      <div id="resultado">
        Digite um número para gerar a tabuada.
      </div>

    </section>

  </main>

  <footer>
    <p>&copy; Thomas Eduardo</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
