<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>primeiro programa...</title>
    <style>
      body {
        background-color: rgb(146, 146, 163);
      }
      h1 {
        color: rgb(255, 255, 255);
      }
      p {
        color: rgb(255, 255, 255);
      }
      font-family: Arial, sans-serif;
    </style>
  </head>

  <body>
    <h1>Olá, mundo!</h1>
    <p>Este é o meu primeiro programa em HTML.</p>

    <script>
      // Converte as entradas para número antes de realizar a soma.
      var n1 = Number(window.prompt('Digite um numero: '));
      var n2 = Number(window.prompt('Digite o segundo numero: '));
      var s = n1 + n2;

      window.alert(`A soma entre ${n1} e ${n2} é igual a  ${s}`);
    </script>
  </body>
</html>
